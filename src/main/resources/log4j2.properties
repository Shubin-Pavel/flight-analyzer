status = error
name = FlightAnalyzerLogging

property.filename = logs/flight-analyzer.log
property.pattern = %d{yyyy-MM-dd HH:mm:ss} - [%-5level] - %c{1} - %msg%n

appender.console.type = Console
appender.console.name = ConsoleAppender
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = ${pattern}

appender.file.type = File
appender.file.name = FileAppender
appender.file.fileName = ${filename}
appender.file.append = true
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = ${pattern}

appender.error.type = File
appender.error.name = ErrorAppender
appender.error.fileName = logs/flight-analyzer-error.log
appender.error.append = true
appender.error.layout.type = PatternLayout
appender.error.layout.pattern = ${pattern}
appender.error.filter.threshold.type = ThresholdFilter
appender.error.filter.threshold.level = ERROR

rootLogger.level = INFO
rootLogger.appenderRefs = console, file, error
rootLogger.appenderRef.console.ref = ConsoleAppender
rootLogger.appenderRef.file.ref = FileAppender
rootLogger.appenderRef.error.ref = ErrorAppender

logger.spark.name = org.apache.spark
logger.spark.level = WARN

logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = WARN